<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0D1418">
<title>知识库审核</title>
<script>
(function(){var t=localStorage.getItem('assistantTheme');if(t!=='light'&&t!=='dark')t='dark';document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
:root,[data-theme="dark"]{
  color-scheme:dark;
  --ink:#0D1418; --panel:#151E24; --panel-2:#1A252C;
  --surface:#1C2931; --surface-hi:#24343D;
  --line:#2B3D46; --line-soft:#213038;
  --paper:#E9F1F3; --muted:#A9BEC6; --faint:#8AA3AD;
  --celadon:#5FD4BC; --celadon-2:#3E9FB0;
  --celadon-soft:rgba(95,212,188,.11);
  --celadon-hover:rgba(95,212,188,.19);
  --celadon-line:rgba(95,212,188,.36);
  --accent-gradient:linear-gradient(120deg,#5FD4BC,#3E9FB0);
  --on-accent:#0C1B1B;
  --selection:rgba(95,212,188,.26);
  --app-bg:
    radial-gradient(1100px 700px at 86% -14%,rgba(72,196,178,.10),transparent 62%),
    radial-gradient(720px 520px at -10% 108%,rgba(56,140,170,.07),transparent 60%),
    #0D1418;
  --code-bg:#0B1115; --quote-bg:rgba(255,255,255,.02);
  --warn:#E5BC7E; --danger:#F0959D;
  --radius:11px; --radius-sm:7px;
  --ease:cubic-bezier(.2,.7,.25,1); --dur:.18s;
}
[data-theme="light"]{
  color-scheme:light;
  --ink:#F4F8F8; --panel:#FFFFFF; --panel-2:#F8FBFA;
  --surface:#EEF4F3; --surface-hi:#E2ECE9;
  --line:#D3E1DE; --line-soft:#E5EEEC;
  --paper:#152A2C; --muted:#536E71; --faint:#6C8588;
  --celadon:#0E7C6C; --celadon-2:#167A8C;
  --celadon-soft:rgba(14,124,108,.09);
  --celadon-hover:rgba(14,124,108,.15);
  --celadon-line:rgba(14,124,108,.28);
  --accent-gradient:linear-gradient(120deg,#0E7C6C,#167A8C);
  --on-accent:#FFFFFF;
  --selection:rgba(14,124,108,.18);
  --app-bg:
    radial-gradient(1100px 700px at 86% -14%,rgba(14,124,108,.06),transparent 62%),
    #F4F8F8;
  --code-bg:#EAF0EF; --quote-bg:rgba(0,0,0,.02);
  --warn:#9A6A1F; --danger:#B23A45;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:"Microsoft YaHei Light","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px;line-height:1.7;color:var(--paper);background:var(--app-bg);
  background-size:auto,auto,auto;
}
button,textarea,input{font-family:inherit}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 16px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--paper);font-size:12.5px;cursor:pointer;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease);
}
.btn:hover{background:var(--surface-hi);border-color:var(--celadon-line)}
.btn-primary{background:var(--accent-gradient);border-color:transparent;color:var(--on-accent);font-weight:600}
.btn-primary:hover{filter:brightness(1.08)}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:rgba(240,149,157,.1)}
.btn-sm{padding:5px 11px;font-size:11.5px}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;
  background:transparent;border:0;color:var(--faint);border-radius:6px;cursor:pointer;font-size:17px;
}
.icon-btn:hover{color:var(--paper);background:var(--surface-hi)}

/* 顶栏 */
.topbar{
  height:58px;display:flex;align-items:center;gap:14px;padding:0 22px;
  border-bottom:1px solid var(--line);background:var(--panel);
}
.topbar-brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:650}
.topbar-brand .mark{
  width:30px;height:30px;border-radius:9px;background:var(--accent-gradient);
  color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700
}
.topbar-sub{font-size:11px;color:var(--faint);font-weight:400}
.topbar-spacer{flex:1}
.theme-toggle{
  padding:6px 12px;font-size:11.5px;border:1px solid var(--line);border-radius:7px;
  background:var(--surface);color:var(--muted);cursor:pointer
}
.theme-toggle:hover{color:var(--paper);border-color:var(--celadon-line)}

/* 三栏布局 */
.review-layout{
  display:grid;grid-template-columns:330px 1fr 250px;
  height:calc(100vh - 58px);min-height:0;
}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column}
.pane-left{border-right:1px solid var(--line);background:var(--panel)}
.pane-center{background:var(--app-bg);padding:22px 28px;overflow-y:auto}
.pane-right{border-left:1px solid var(--line);background:var(--panel);padding:20px 18px;overflow-y:auto}
.pane-title{
  font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;
  padding:18px 18px 10px;display:flex;align-items:center;gap:8px
}
.pane-title .count{
  font-size:10px;padding:1px 7px;border-radius:10px;background:var(--celadon-soft);
  color:var(--celadon);border:1px solid var(--celadon-line);font-weight:500
}
.doc-tabs{padding:0 12px 10px;display:flex;flex-direction:column;gap:5px;max-height:230px;overflow-y:auto;border-bottom:1px solid var(--line-soft)}
.doc-tab{
  display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;
  border:1px solid var(--line-soft);background:var(--panel-2);cursor:pointer;
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease)
}
.doc-tab:hover{border-color:var(--celadon-line)}
.doc-tab.active{border-color:var(--celadon);background:var(--celadon-soft)}
.doc-tab-name{font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--paper)}
.doc-tab-meta{font-size:10px;color:var(--faint);white-space:nowrap}
.chunk-list{padding:10px 12px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:6px}
.chunk-item{
  display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:8px;
  border:1px solid var(--line-soft);background:var(--panel-2);cursor:pointer;
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease)
}
.chunk-item:hover{border-color:var(--celadon-line)}
.chunk-item.active{border-color:var(--celadon);background:var(--celadon-soft)}
.chunk-item.checked{border-color:var(--warn)}
.chunk-no{
  width:26px;height:26px;flex:none;border-radius:7px;background:var(--surface);
  color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:600
}
.chunk-item.active .chunk-no{background:var(--celadon);color:var(--on-accent)}
.chunk-info{flex:1;min-width:0;overflow:hidden}
.chunk-label{display:block;font-size:12px;color:var(--paper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;word-break:break-all}
.chunk-sub{display:block;font-size:10px;color:var(--faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chunk-section{display:block;font-size:9.5px;color:var(--celadon);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chunk-section.unset{color:var(--faint);font-style:italic}
.chunk-kind{font-size:9.5px;padding:1px 6px;border-radius:9px;background:var(--celadon-soft);color:var(--celadon);border:1px solid var(--celadon-line)}
.chunk-kind.table{background:rgba(229,188,126,.13);color:var(--warn);border-color:rgba(229,188,126,.4)}

/* 中间编辑区 */
.edit-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.edit-title{font-size:17px;font-weight:650;color:var(--paper)}
.edit-sub{font-size:11.5px;color:var(--faint);margin-top:3px}
.edit-card{
  border:1px solid var(--line);border-radius:12px;background:var(--panel);
  padding:20px 22px;margin-bottom:16px
}
.edit-card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.edit-card-tag{font-size:11px;padding:2px 9px;border-radius:10px;background:var(--celadon-soft);color:var(--celadon);border:1px solid var(--celadon-line)}
.edit-card-tag.table{background:rgba(229,188,126,.13);color:var(--warn);border-color:rgba(229,188,126,.4)}
.edit-card-pos{font-size:11px;color:var(--faint)}
.edit-card-actions{margin-left:auto;display:flex;gap:8px}
.edit-title-field{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.edit-title-field label{font-size:11px;color:var(--muted);flex:none;min-width:62px}
.edit-title-input{
  flex:1;min-width:0;padding:7px 11px;border-radius:7px;font-size:12px;
  color:var(--paper);background:var(--surface);border:1px solid var(--line);
  outline:none;font-family:inherit
}
.edit-title-input:focus{border-color:var(--celadon)}
.edit-title-hint{font-size:10px;color:var(--faint);margin-top:6px;line-height:1.5}
.edit-textarea{
  width:100%;min-height:340px;resize:vertical;padding:16px 18px;
  border:1px solid var(--line);border-radius:9px;background:var(--panel-2);
  color:var(--paper);font-size:14px;line-height:1.85;outline:none;
  transition:border-color var(--dur) var(--ease)
}
.edit-textarea:focus{border-color:var(--celadon)}
.edit-table-wrap{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--panel-2)}
.edit-table{border-collapse:collapse;width:100%;font-size:12.5px;color:var(--paper)}
.edit-table th,.edit-table td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;word-break:break-word;line-height:1.6}
.edit-table th{background:var(--surface);color:var(--celadon);position:sticky;top:0;font-weight:600}
.edit-table td[rowspan],.edit-table td[colspan]{vertical-align:middle;text-align:center;font-weight:500}
.edit-table tr:nth-child(even) td{background:rgba(127,127,127,.04)}
.edit-note{font-size:11px;color:var(--faint);margin-top:10px;line-height:1.7}
.empty-edit{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:420px;color:var(--faint);gap:10px;text-align:center
}
.empty-edit .big{font-size:40px;opacity:.5}

/* 右侧操作区 */
.op-group{margin-bottom:22px}
.op-group-title{font-size:11px;color:var(--faint);letter-spacing:.04em;margin-bottom:10px;font-weight:600}
.op-btn{
  width:100%;display:flex;align-items:center;gap:9px;padding:10px 12px;margin-bottom:7px;
  border:1px solid var(--line);border-radius:8px;background:var(--panel-2);
  color:var(--paper);font-size:12.5px;cursor:pointer;text-align:left;
  transition:border-color var(--dur) var(--ease)
}
.op-btn:hover{border-color:var(--celadon-line)}
.op-btn .op-ico{width:20px;text-align:center;color:var(--celadon);font-size:14px}
.op-btn.danger .op-ico{color:var(--danger)}
.op-btn:disabled{opacity:.45;cursor:not-allowed}
.merge-box{
  border:1px dashed var(--line);border-radius:9px;padding:11px 12px;background:var(--panel-2);
  max-height:220px;overflow-y:auto
}
.merge-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--paper);padding:5px 0;cursor:pointer}
.merge-row input{accent-color:var(--celadon);cursor:pointer}
.merge-row .m-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.summary-box{border:1px solid var(--line-soft);border-radius:9px;padding:12px;font-size:11.5px;color:var(--muted);line-height:1.9}
.summary-box b{color:var(--paper);font-weight:600}
.footer-actions{display:flex;gap:9px;margin-top:16px}
.footer-actions .btn{flex:1}

/* 提示 */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface-hi);border:1px solid var(--celadon-line);color:var(--paper);
  padding:10px 20px;border-radius:9px;font-size:12.5px;opacity:0;pointer-events:none;
  transition:opacity var(--dur),transform var(--dur);z-index:99;box-shadow:0 12px 34px rgba(0,0,0,.3)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:1100px){
  .review-layout{grid-template-columns:280px 1fr}
  .pane-right{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-brand"><span class="mark">✓</span>知识库审核</div>
  <span class="topbar-sub">审核通过后文档才会进入知识库并可被检索</span>
  <div class="topbar-spacer"></div>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">切换主题</button>
  <button class="btn btn-sm" onclick="location.href='/'">返回聊天</button>
</header>

<div class="review-layout">
  <aside class="pane pane-left">
    <div class="pane-title">待审核文档 <span class="count" id="docCount">0</span></div>
    <div class="doc-tabs" id="docTabs"></div>
    <div class="pane-title">切片列表 <span class="count" id="chunkCount">0</span>
      <button class="btn btn-sm" style="margin-left:auto;padding:3px 9px" onclick="loadStaging()">刷新</button>
    </div>
    <div class="chunk-list" id="chunkList"></div>
  </aside>

  <main class="pane pane-center" id="centerPane">
    <div class="edit-head">
      <div>
        <div class="edit-title" id="editTitle">选择一个切片开始审核</div>
        <div class="edit-sub" id="editSub">在左侧点击文档和切片，内容会显示在这里编辑</div>
      </div>
    </div>
    <div id="editArea"></div>
  </main>

  <aside class="pane pane-right">
    <div class="op-group">
      <div class="op-group-title">当前切片操作</div>
      <button class="op-btn" id="btnSave" onclick="saveCurrent()" disabled><span class="op-ico">✎</span>保存修改</button>
      <button class="op-btn danger" id="btnDelete" onclick="deleteCurrent()" disabled><span class="op-ico">✕</span>删除此块</button>
    </div>
    <div class="op-group">
      <div class="op-group-title">合并相邻文本块</div>
      <div class="merge-box" id="mergeBox"><div style="font-size:11px;color:var(--faint)">勾选左侧要合并的文本块</div></div>
      <button class="btn btn-sm" style="width:100%;margin-top:8px" onclick="doMerge()">合并选中块</button>
    </div>
    <div class="op-group">
      <div class="op-group-title">文档概览</div>
      <div class="summary-box" id="summaryBox">未选择文档</div>
    </div>
    <div class="op-group">
      <div class="op-group-title">整篇处理</div>
      <div class="footer-actions">
        <button class="btn btn-danger" onclick="rejectDoc()">驳回</button>
        <button class="btn btn-primary" onclick="approveDoc()">通过入库</button>
      </div>
      <div class="edit-note">驳回会丢弃解析结果与原件；通过后才写入数据库并向量化。</div>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script>
const THEME_KEY='assistantTheme';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem(THEME_KEY,t);}catch(e){}
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',t==='light'?'#F4F8F8':'#0D1418');
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')||'dark';
  applyTheme(cur==='dark'?'light':'dark');
}
applyTheme(document.documentElement.getAttribute('data-theme')||'dark');

let kbId='', staging=[], currentDoc=null, currentChunk=null;
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400);
}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
async function api(method,url,body){
  const opt={method,headers:{}};
  if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
  const r=await fetch('/api/v1'+url,opt);
  try{return await r.json();}catch(e){return {code:-1,message:'网络异常'};}
}

async function init(){
  const params=new URLSearchParams(location.search);
  kbId=params.get('kb_id')||'';
  if(!kbId){
    const r=await api('GET','/kb/list');
    if(r.code===200&&r.data&&r.data.length){
      const own=r.data.find(k=>k.role==='owner')||r.data[0];
      kbId=own.id;
    }
  }
  if(!kbId){toast('未找到知识库');return;}
  await loadStaging();
}

async function loadStaging(){
  const r=await api('GET','/kb/'+encodeURIComponent(kbId)+'/staging');
  if(r.code!==200){toast(r.message||'加载失败');return;}
  staging=r.data||[];
  document.getElementById('docCount').textContent=staging.length;
  const tabs=document.getElementById('docTabs');
  tabs.innerHTML=staging.length?staging.map(s=>{
    const cnt=(s.chunk_count||0)+(s.table_count||0);
    return '<div class="doc-tab'+(currentDoc&&currentDoc.id===s.id?' active':'')+'" onclick="selectDoc(\''+s.id+'\')">'+
      '<span class="chunk-kind" style="font-size:9px">档</span>'+
      '<span class="doc-tab-name" title="'+esc(s.filename)+'">'+esc(s.filename)+'</span>'+
      '<span class="doc-tab-meta">'+cnt+'块</span></div>';
  }).join(''):'<div style="font-size:11px;color:var(--faint);padding:8px">暂无待审核文档</div>';
  if(staging.length){
    const target=currentDoc?staging.find(s=>s.id===currentDoc.id):staging[0];
    await selectDoc(target?target.id:staging[0].id);
  }else{
    currentDoc=null;currentChunk=null;
    document.getElementById('chunkList').innerHTML='';
    document.getElementById('chunkCount').textContent='0';
    document.getElementById('editArea').innerHTML='<div class="empty-edit"><div class="big">✓</div><div>没有待审核的文档</div><div style="font-size:11px">在聊天页上传文档后，会先出现在这里审核</div></div>';
    document.getElementById('editTitle').textContent='暂无待审核内容';
  }
}

async function selectDoc(id){
  const r=await api('GET','/kb/'+encodeURIComponent(kbId)+'/staging/'+encodeURIComponent(id));
  if(r.code!==200){toast(r.message||'加载失败');return;}
  currentDoc=r.data;
  const chunks=currentDoc.chunks||[];
  document.querySelectorAll('.doc-tab').forEach((el,i)=>el.classList.toggle('active',staging[i]&&staging[i].id===id));
  document.getElementById('chunkCount').textContent=chunks.length;
  const list=document.getElementById('chunkList');
  list.innerHTML=chunks.length?chunks.map((c,i)=>{
    const preview=(c.content||'').replace(/\s+/g,' ').slice(0,26);
    return '<div class="chunk-item'+(currentChunk&&currentChunk.id===c.id?' active':'')+'" onclick="selectChunk(\''+c.id+'\')">'+
      '<span class="chunk-no">'+(i+1)+'</span>'+
      '<span class="chunk-info"><span class="chunk-label" title="'+esc((c.content||'').replace(/\s+/g,' ').slice(0,200))+'">'+esc(preview||c.table_name||'空块')+'</span>'+
      '<span class="chunk-section'+(c.section_path?'':' unset')+'" title="点击此块可修改'+(c.kind==='table'?'表格标题':'章节标题')+'">'+
        (c.section_path?esc(c.section_path):(c.kind==='table'?(c.table_name?esc(c.table_name):'未命名表格'):'未设章节标题（点击设置）'))+'</span>'+
      '<span class="chunk-sub">'+(c.kind==='table'?((c.row_count||0)+'行×'+(c.col_count||0)+'列'):((c.content||'').length+' 字'))+'</span></span>'+
      '<span class="chunk-kind'+(c.kind==='table'?' table':'')+'">'+(c.kind==='table'?'表':'文')+'</span>'+
      '</div>';
  }).join(''):'<div style="font-size:11px;color:var(--faint);padding:8px">该文档无切片</div>';
  const target=currentChunk&&chunks.find(c=>c.id===currentChunk.id)?currentChunk:(chunks[0]||null);
  if(target)selectChunk(target.id);else renderEmpty();
  renderMergeBox();
  document.getElementById('summaryBox').innerHTML=
    '<b>'+esc(currentDoc.filename)+'</b><br>文本块 '+currentDoc.chunk_count+' 个<br>表格 '+currentDoc.table_count+' 张<br>共 '+chunks.length+' 块';
}

function selectChunk(id){
  currentChunk=(currentDoc.chunks||[]).find(c=>c.id===id)||null;
  document.querySelectorAll('.chunk-item').forEach(el=>el.classList.toggle('active',el.getAttribute('onclick').includes(id)));
  if(!currentChunk)return;
  const c=currentChunk;
  const idx=(currentDoc.chunks||[]).indexOf(c)+1;
  document.getElementById('editTitle').textContent='正在审核 第 '+idx+' 块 · '+(c.kind==='table'?'表格':'文本');
  document.getElementById('editSub').textContent=esc(currentDoc.filename)+(c.section_path?(' · 章节：'+c.section_path):'');
  // 表格块也能改标题（表格名），所以保存按钮始终可用
  document.getElementById('btnSave').disabled=false;
  document.getElementById('btnDelete').disabled=false;
  const area=document.getElementById('editArea');
  if(c.kind==='table'){
    let html='<table class="edit-table"><tbody>';
    const skip=new Set();
    for(const m of (c.merges||[])){
      if((m.rowspan>1||m.colspan>1)&&m.row!=null&&m.col!=null){
        for(let r=m.row;r<m.row+(m.rowspan||1);r++)
          for(let col=m.col;col<m.col+(m.colspan||1);col++)
            if(r!==m.row||col!==m.col)skip.add(r+':'+col);
      }
    }
    (c.rows||[]).forEach((row,ri)=>{
      html+='<tr>';
      (row||[]).forEach((cell,ci)=>{
        if(skip.has(ri+':'+ci))return;
        let rs=1,cs=1;
        for(const m of (c.merges||[])){
          if(m.row===ri&&m.col===ci){rs=m.rowspan||1;cs=m.colspan||1;break;}
        }
        const attr=(rs>1?' rowspan="'+rs+'"':'')+(cs>1?' colspan="'+cs+'"':'');
        html+='<td'+attr+'>'+esc(cell==null?'':cell)+'</td>';
      });
      html+='</tr>';
    });
    html+='</tbody></table>';
    area.innerHTML='<div class="edit-card"><div class="edit-card-head">'+
      '<span class="edit-card-tag table">表格（只读）</span>'+
      '<span class="edit-card-pos">第 '+idx+' 块 · '+(c.row_count||0)+' 行 × '+(c.col_count||0)+' 列 · 完整度 '+Math.round((c.fill_rate||0)*100)+'%</span></div>'+
      '<div class="edit-title-field"><label>表格标题</label>'+
      '<input class="edit-title-input" id="chunkTitle" value="'+esc(c.table_name||'')+'" placeholder="给这张表起个名字，显示在列表中"></div>'+
      '<div class="edit-table-wrap">'+html+'</div>'+
      '<div class="edit-note">表格数据从原文件真实抽取，保持完整不参与切分；表格标题可修改。如需改表格内容，请修改原文件后重新上传。</div></div>';
  }else{
    area.innerHTML='<div class="edit-card"><div class="edit-card-head">'+
      '<span class="edit-card-tag">文本块 · 可编辑</span>'+
      '<span class="edit-card-pos">第 '+idx+' 块 · '+((c.content||'').length)+' 字</span></div>'+
      '<div class="edit-title-field"><label>章节标题</label>'+
      '<input class="edit-title-input" id="chunkTitle" value="'+esc(c.section_path||'')+'" placeholder="可修改，列表中以绿色显示；检索时按此聚合整节"></div>'+
      '<div class="edit-title-hint">这是系统识别的章节路径，也可能来自自动切分。改成你想要的标题，列表和检索都会用新标题。</div>'+
      '<textarea class="edit-textarea" id="chunkEditor">'+esc(c.content||'')+'</textarea>'+
      '<div class="edit-note">可以直接修改文字，修正解析或 OCR 错误；改完点右侧「保存修改」。勾选相邻文本块可合并成一段。</div></div>';
  }
}

function renderEmpty(){
  document.getElementById('editTitle').textContent='选择一个切片开始审核';
  document.getElementById('editSub').textContent='在左侧点击文档和切片，内容会显示在这里';
  document.getElementById('editArea').innerHTML='<div class="empty-edit"><div class="big">✎</div><div>请选择一个切片</div></div>';
  document.getElementById('btnSave').disabled=true;
  document.getElementById('btnDelete').disabled=true;
}

function renderMergeBox(){
  const box=document.getElementById('mergeBox');
  const texts=(currentDoc.chunks||[]).filter(c=>c.kind==='text');
  if(texts.length<2){box.innerHTML='<div style="font-size:11px;color:var(--faint)">文本块不足两个，无法合并</div>';return;}
  box.innerHTML=texts.map(c=>{
    const t=(c.content||'').replace(/\s+/g,' ').slice(0,20);
    return '<label class="merge-row"><input type="checkbox" class="merge-chk" value="'+c.id+'"><span class="m-text">'+esc(t)+'</span></label>';
  }).join('');
}

async function saveCurrent(){
  if(!currentChunk)return;
  const titleEl=document.getElementById('chunkTitle');
  const payload={};
  if(titleEl)payload[currentChunk.kind==='table'?'table_name':'section_path']=titleEl.value.trim();
  if(currentChunk.kind!=='table'){
    const ta=document.getElementById('chunkEditor');
    if(!ta||!ta.value.trim()){toast('内容不能为空');return;}
    payload.content=ta.value;
  }
  const r=await api('PUT','/kb/'+encodeURIComponent(kbId)+'/staging/'+encodeURIComponent(currentDoc.id)+'/chunks/'+encodeURIComponent(currentChunk.id),payload);
  if(r.code===200){toast('已保存');await selectDoc(currentDoc.id);}
  else toast(r.message||'保存失败');
}

async function deleteCurrent(){
  if(!currentChunk||!confirm('确认删除这个切片？不可恢复。'))return;
  const r=await api('DELETE','/kb/'+encodeURIComponent(kbId)+'/staging/'+encodeURIComponent(currentDoc.id)+'/chunks/'+encodeURIComponent(currentChunk.id));
  if(r.code!==200){toast(r.message||'删除失败');return;}
  currentChunk=null;
  toast('已删除');
  await loadStaging();
}

async function doMerge(){
  const ids=[...document.querySelectorAll('.merge-chk:checked')].map(x=>x.value);
  if(ids.length<2){toast('请勾选至少两个文本块');return;}
  if(!confirm('确认合并选中的 '+ids.length+' 个文本块？'))return;
  const r=await api('POST','/kb/'+encodeURIComponent(kbId)+'/staging/'+encodeURIComponent(currentDoc.id)+'/chunks/merge',{ids});
  if(r.code!==200){toast(r.message||'合并失败');return;}
  currentChunk=null;
  toast('已合并 '+ids.length+' 个文本块');
  await selectDoc(currentDoc.id);
}

async function approveDoc(){
  if(!currentDoc)return;
  if(!confirm('确认通过审核？文档将正式进入知识库并开始向量化。'))return;
  const r=await api('POST','/kb/'+encodeURIComponent(kbId)+'/staging/'+encodeURIComponent(currentDoc.id)+'/approve',{});
  if(r.code!==200){toast(r.message||'审核失败');return;}
  toast('审核通过，文档已入库');
  currentDoc=null;currentChunk=null;
  await loadStaging();
}

async function rejectDoc(){
  if(!currentDoc)return;
  if(!confirm('确认驳回？将丢弃该文档全部解析结果与原件，不可恢复。'))return;
  const r=await api('DELETE','/kb/'+encodeURIComponent(kbId)+'/staging/'+encodeURIComponent(currentDoc.id));
  if(r.code!==200){toast(r.message||'驳回失败');return;}
  toast('已驳回');
  currentDoc=null;currentChunk=null;
  await loadStaging();
}

init();
</script>
</body>
</html>
